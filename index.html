<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажер слів</title>
<meta name="description" content="Тренажер англійських слів і граматики: слова, вправи, умовні речення, пасив.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Layout: one narrow column, a 4-step rail on top, one exercise card at a time */
:root{
  --bg:#eef2f7; --paper:#ffffff; --ink:#18233a; --muted:#5d6982; --line:#d5dce8;
  --accent:#2f55d4; --accent-soft:#e3e9fb; --ok:#1f8a5b; --ok-soft:#dff3e9; --bad:#c2413a; --bad-soft:#fae3e1; --hl:#fde68a;
  --f-word:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --paper:#18213a; --ink:#e7ecf7; --muted:#9aa6c0; --line:#2b3654;
  --accent:#7f9dff; --accent-soft:#25335c; --ok:#5fd19b; --ok-soft:#173a2c; --bad:#ff8a80; --bad-soft:#41211f; --hl:#6b5512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --paper:#18213a; --ink:#e7ecf7; --muted:#9aa6c0; --line:#2b3654;
  --accent:#7f9dff; --accent-soft:#25335c; --ok:#5fd19b; --ok-soft:#173a2c; --bad:#ff8a80; --bad-soft:#41211f; --hl:#6b5512; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-word);font-size:1.6rem;margin:0;text-wrap:balance}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:.9rem;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.rail button{font:inherit;font-size:.82rem;line-height:1.25;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:10px;padding:8px 6px;cursor:pointer;text-align:left;min-width:0}
.rail button b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.rail button[aria-current="true"] b{color:var(--accent)}
.rail button.done b::after{content:" ✓";color:var(--ok)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prompt{font-size:.9rem;color:var(--muted);margin:0}
.big{font-family:var(--f-word);font-size:clamp(1.7rem,6vw,2.3rem);font-weight:700;margin:0;line-height:1.15;overflow-wrap:anywhere}
.sent{font-family:var(--f-word);font-size:1.3rem;font-weight:500;margin:0;line-height:1.5}
.sent .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.hidden-word{color:var(--muted)}
.opt{font:inherit;font-family:var(--f-word);font-size:1.1rem;padding:14px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:.7}
input[type=text],textarea{font:inherit;font-size:1.15rem;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{font-size:1rem;min-height:180px;resize:vertical}
input.okk{border-color:var(--ok);background:var(--ok-soft)}
input.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){input.err{animation:none}.bar i{transition:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;padding:11px 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{margin:0;font-size:.95rem;min-height:1.5em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:12px;border:1.5px dashed var(--line)}
.chips.pool{border-style:solid;border-color:transparent;padding:0}
.chip{font:inherit;font-family:var(--f-word);font-size:1.1rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chips:not(.pool) .chip{background:var(--accent-soft);border-color:var(--accent)}
.finish{text-align:center;align-items:center}
.uk{color:var(--muted);font-size:.95rem;margin:0}
.words{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;color:var(--muted)}
.tag{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.rule{margin:0;font-size:.92rem;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.from{font-family:var(--f-word);font-size:1.25rem;margin:0}
.score{margin:0;font-family:var(--f-word);font-size:1.15rem;color:var(--muted)}
.score b{font-size:2.6rem;color:var(--ink);font-variant-numeric:tabular-nums}
.errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.errs li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--bad-soft);min-width:0;overflow-wrap:anywhere}
.errs-ok{font-family:var(--f-word);font-weight:700}
.errs-bad{font-size:.88rem;color:var(--bad)}
.errs-why{font-size:.9rem;color:var(--ink)}
.errs-rule{font-size:.85rem;color:var(--muted)}
.rail button:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-size:.86rem;line-height:1.35}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 9px;vertical-align:top;text-align:left}
.tbl thead th{background:var(--ink);color:var(--paper);font-weight:600;font-size:.8rem;letter-spacing:.03em}
.tbl tbody th{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.8rem;writing-mode:horizontal-tb;min-width:84px}
.tbl.grid td{min-width:170px}
.tbl .f{display:inline;font-weight:700;background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.tbl .u{display:block;margin-top:4px}
.tbl .m{display:block;margin-top:3px;color:var(--muted);font-style:italic;font-size:.8rem}
.tbl .p{display:block;margin-top:5px;font-size:.78rem;color:var(--muted)}
.tbl .p b{color:var(--ink)}
.tbl .x{display:block;margin-top:5px;border:0;background:none;padding:0;font:inherit;color:var(--accent);text-align:left;cursor:pointer}
.tbl td.empty{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px);opacity:.5}
.th-notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.sets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sets button{flex:0 0 auto;font:inherit;font-weight:600;font-size:.92rem;text-align:left;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sets button small{font-weight:400;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sets button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sets button[aria-selected="true"] small{color:var(--paper);opacity:.75}
.wl summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:2px 0}
.wl .words{margin-top:8px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn{display:inline-block}
.field{display:flex;flex-direction:column;gap:6px}
select{font:inherit;font-size:1rem;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
input[type=text]#setName{font-size:1rem}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.hist-t{display:flex;flex-direction:column;min-width:0}
.hist-t small{color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn.danger{color:var(--bad)}
.theory{display:flex;flex-direction:column;gap:12px}
.th-row{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.th-f{margin:0;font-weight:600}
.th-ex{font:inherit;font-family:var(--f-word);font-size:1.05rem;text-align:left;background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer}
.words span{padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.words .pick{font:inherit;font-size:.85rem;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-align:left}
.words .pick::before{content:"✓";font-weight:700;color:var(--accent);width:1em}
.words .pick[aria-pressed="false"]{background:transparent;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.words .pick[aria-pressed="false"]::before{content:"";}
.pickbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0 2px;font-size:.85rem;color:var(--muted)}
.pickbar .linkbtn{font-size:.85rem}
.words .gex{display:block;width:100%;border-radius:10px;padding:6px 10px;color:var(--ink)}
.words .gex b{color:var(--accent);font-weight:600}
.words .gex i{color:var(--muted)}
.words .pickbar span{border:0;padding:0;border-radius:0}
.btn:disabled{opacity:.45;cursor:default}
.pickapply{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Тренажер слів</h1>
    <button class="linkbtn" id="editBtn" type="button">Мої слова й набори</button>

  <p class="rule" id="note" hidden></p>
  <nav class="rail" id="rail" aria-label="Етапи"></nav>
  <main class="card" id="card"></main>
</div>

", "buildUk": "Я це зроблю, хочеш ти чи ні", "grammar": [{"type": "choose", "tense": "whether or not", "q": "I will do this ___ you want it or not.", "options": ["whether", "if not", "unless", "although"], "answer": "whether", "rule": "whether … or not — незалежно від того, чи…"}]}, {"en": "whilst", "uk": "Вона читала, тоді як я готувала", "build": "She was reading whilst I was cooking", "buildUk": "Вона читала, тоді як я готувала", "grammar": [{"type": "choose", "tense": "whilst", "q": "She was reading ___ I was cooking.", "options": ["whilst", "however", "although", "despite"], "answer": "whilst", "rule": "whilst = while — тоді як."}]}, {"en": "via", "uk": "Я надіслала це електронною поштою", "build": "I sent it via email", "buildUk": "Я надіслала це електронною поштою", "grammar": [{"type": "choose", "tense": "via", "q": "I sent the documents ___ email.", "options": ["via", "with", "by the", "on"], "answer": "via", "rule": "via — через щось (канал)."}]}]}, {"id": "g_adjectives", "name": "Сильні прикметники і суфікси", "kind": "grammar", "theory": {"rows": [["very + звичайний", "very good, very bad, very big", "Звичайні прикметники посилюємо very.", "It was very cold."], ["absolutely + сильний", "absolutely gorgeous, terrible, stunning", "Сильні прикметники НЕ з very, а з absolutely, really, utterly.", "The view was absolutely stunning."], ["підсилювачі", "quite, terribly, extremely, incredibly, utterly, totally", "Посилюють прикметники та прислівники.", "It's extremely important."], ["суфікси", "science → scientist → scientific → scientifically", "Іменник → людина → прикметник → прислівник.", "She thinks scientifically."], ["un- / non- / -less", "unprofitable, non-profit, profitless", "Заперечні префікси й суфікси.", "It's a non-profit organisation."]], "notes": ["Сильні прикметники: amazing, awful, brilliant, dreadful, enormous, fantastic, gorgeous, horrible, incredible, ridiculous, stunning, terrible, useless, filthy.", "profit → profitable → profitably → profitability.", "-ful = з чимось (useful), -less = без чогось (useless)."]}, "words": [{"en": "absolutely", "uk": "Вид був просто приголомшливий", "build": "The view was absolutely stunning", "buildUk": "Вид був просто приголомшливий", "grammar": [{"type": "choose", "tense": "absolutely", "q": "The view was ___ stunning.", "options": ["absolutely", "very", "a bit", "much"], "answer": "absolutely", "rule": "Сильні прикметники посилюємо absolutely, а не very."}]}, {"en": "very", "uk": "Вода була дуже холодна", "build": "The water was very cold", "buildUk": "Вода була дуже холодна", "grammar": [{"type": "choose", "tense": "very", "q": "The water was ___ cold.", "options": ["very", "absolutely", "utterly", "totally"], "answer": "very", "rule": "Звичайні прикметники посилюємо very."}]}, {"en": "really + сильний", "uk": "Їжа була справді жахлива", "build": "The food was really awful", "buildUk": "Їжа була справді жахлива", "grammar": [{"type": "choose", "tense": "really + сильний", "q": "The food was ___ awful.", "options": ["really", "very", "a little", "quite a"], "answer": "really", "rule": "Сильний прикметник: really або absolutely, не very."}]}, {"en": "utterly", "uk": "Це було цілковито безглуздо", "build": "It was utterly ridiculous", "buildUk": "Це було цілковито безглуздо", "grammar": [{"type": "choose", "tense": "utterly", "q": "His idea was ___ ridiculous.", "options": ["utterly", "very", "slightly", "more"], "answer": "utterly", "rule": "utterly — цілковито, з сильними прикметниками."}]}, {"en": "enormous", "uk": "У них величезний сад", "build": "They have an absolutely enormous garden", "buildUk": "У них величезний сад", "grammar": [{"type": "choose", "tense": "enormous", "q": "They have an ___ enormous garden.", "options": ["absolutely", "very", "a bit", "quite a"], "answer": "absolutely", "rule": "enormous — сильний прикметник, тому absolutely."}]}, {"en": "extremely", "uk": "Ця зустріч надзвичайно важлива", "build": "This meeting is extremely important", "buildUk": "Ця зустріч надзвичайно важлива", "grammar": [{"type": "choose", "tense": "extremely", "q": "This meeting is ___ important.", "options": ["extremely", "absolutely", "utterly", "completely"], "answer": "extremely", "rule": "important — звичайний прикметник: very або extremely."}]}, {"en": "scientist", "uk": "Вона відома науковиця", "build": "She is a famous scientist", "buildUk": "Вона відома науковиця", "grammar": [{"type": "choose", "tense": "scientist", "q": "She is a famous ___.", "options": ["scientist", "science", "scientific", "scientifically"], "answer": "scientist", "rule": "-ist — людина за професією."}]}, {"en": "scientific", "uk": "Нам потрібен науковий підхід", "build": "We need a scientific approach", "buildUk": "Нам потрібен науковий підхід", "grammar": [{"type": "choose", "tense": "scientific", "q": "We need a ___ approach.", "options": ["scientific", "science", "scientist", "scientifically"], "answer": "scientific", "rule": "-ic — прикметник."}]}, {"en": "scientifically", "uk": "Це науково доведено", "build": "It has been scientifically proven", "buildUk": "Це науково доведено", "grammar": [{"type": "choose", "tense": "scientifically", "q": "It has been ___ proven.", "options": ["scientifically", "scientific", "science", "scientist"], "answer": "scientifically", "rule": "-ly — прислівник."}]}, {"en": "profitable", "uk": "Це прибутковий бізнес", "build": "It is a profitable business", "buildUk": "Це прибутковий бізнес", "grammar": [{"type": "choose", "tense": "profitable", "q": "It is a very ___ business.", "options": ["profitable", "profit", "profitably", "profitability"], "answer": "profitable", "rule": "-able — прикметник."}]}, {"en": "non-profit", "uk": "Вона працює в неприбутковій організації", "build": "She works for a non-profit organisation", "buildUk": "Вона працює в неприбутковій організації", "grammar": [{"type": "choose", "tense": "non-profit", "q": "She works for a ___ organisation.", "options": ["non-profit", "unprofit", "profitless", "disprofit"], "answer": "non-profit", "rule": "non-profit — неприбутковий (про організацію)."}]}, {"en": "useless", "uk": "Цей старий телефон марний", "build": "This old phone is useless", "buildUk": "Цей старий телефон марний", "grammar": [{"type": "choose", "tense": "useless", "q": "This old phone is ___.", "options": ["useless", "useful", "unuse", "misuse"], "answer": "useless", "rule": "-less = без: useless — марний."}]}]}]}

<script id="bank" type="application/json">{"grammar": [{"type": "choose", "tense": "Present Simple", "q": "She usually ___ to work by bus.", "options": ["goes", "is going", "go", "has gone"], "answer": "goes", "rule": "Present Simple: звичні дії; з he/she/it додаємо -s.", "explain": "Слово usually вказує на звичку, а she потребує -s."}, {"type": "choose", "tense": "Present Continuous", "q": "Be quiet! The baby ___.", "options": ["is sleeping", "sleeps", "slept", "has slept"], "answer": "is sleeping", "rule": "Present Continuous: am/is/are + -ing для дії саме зараз.", "explain": "«Be quiet!» показує, що дія відбувається в цю мить."}, {"type": "choose", "tense": "Present Perfect", "q": "I ___ this film three times already.", "options": ["have seen", "saw", "see", "am seeing"], "answer": "have seen", "rule": "Present Perfect: have/has + V3 для досвіду до теперішнього моменту.", "explain": "already і «три рази» без конкретного часу вимагають Present Perfect."}, {"type": "choose", "tense": "Past Simple", "q": "We ___ to Lviv last summer.", "options": ["went", "have gone", "go", "were going"], "answer": "went", "rule": "Past Simple: завершена дія в минулому з конкретним часом.", "explain": "last summer називає конкретний час у минулому."}, {"type": "choose", "tense": "Past Continuous", "q": "I ___ a shower when the phone rang.", "options": ["was having", "had", "have had", "am having"], "answer": "was having", "rule": "Past Continuous: was/were + -ing для тривалої дії, яку перервали.", "explain": "Тривалу дію (душ) перервала коротка (дзвінок)."}, {"type": "choose", "tense": "Past Perfect", "q": "When we arrived, the train ___.", "options": ["had already left", "already left", "has already left", "was leaving already"], "answer": "had already left", "rule": "Past Perfect: had + V3 для дії, що сталася раніше іншої дії в минулому.", "explain": "Потяг пішов раніше, ніж ми приїхали."}, {"type": "choose", "tense": "Future Simple", "q": "I think it ___ tomorrow.", "options": ["will rain", "rains", "is raining", "rained"], "answer": "will rain", "rule": "Future Simple: will + дієслово для прогнозів і думок про майбутнє.", "explain": "I think вводить прогноз, тому will."}, {"type": "choose", "tense": "be going to", "q": "Look at those clouds! It ___ rain.", "options": ["is going to", "will", "rains", "has"], "answer": "is going to", "rule": "be going to: прогноз на основі того, що бачимо зараз.", "explain": "Хмари видно зараз, тому be going to."}, {"type": "choose", "tense": "Present Perfect Continuous", "q": "She ___ English for five years.", "options": ["has been learning", "learns", "is learning", "learned"], "answer": "has been learning", "rule": "Present Perfect Continuous: have/has been + -ing для дії, що триває досі (for, since).", "explain": "for five years і дія досі триває."}, {"type": "choose", "tense": "Present Simple, питання", "q": "___ you often work from home?", "options": ["Do", "Are", "Does", "Have"], "answer": "Do", "rule": "Питання в Present Simple: Do/Does + підмет + дієслово.", "explain": "З you використовуємо Do."}, {"type": "choose", "tense": "Past Simple, заперечення", "q": "He ___ the email yesterday.", "options": ["did not send", "not sent", "does not send", "has not sent"], "answer": "did not send", "rule": "Заперечення в Past Simple: did not + базова форма.", "explain": "yesterday означає Past Simple, після did not базова форма send."}, {"type": "choose", "tense": "Present Perfect", "q": "___ you ever been to London?", "options": ["Have", "Did", "Were", "Do"], "answer": "Have", "rule": "Present Perfect у питаннях про досвід: Have/Has + підмет + V3 (ever).", "explain": "ever + been вказує на досвід, тому Have."}, {"type": "choose", "tense": "Future Continuous", "q": "This time tomorrow I ___ on the beach.", "options": ["will be lying", "will lie", "am lying", "lie"], "answer": "will be lying", "rule": "Future Continuous: will be + -ing для дії, що триватиме в певний момент у майбутньому.", "explain": "This time tomorrow означає конкретний момент у майбутньому."}, {"type": "choose", "tense": "Future Perfect", "q": "By next June I ___ my degree.", "options": ["will have finished", "will finish", "finish", "am finishing"], "answer": "will have finished", "rule": "Future Perfect: will have + V3 для дії, що завершиться до певного моменту.", "explain": "By next June означає «до певного моменту»."}, {"type": "transform", "tense": "Present Simple, заперечення", "from": "He likes coffee", "task": "Зроби речення заперечним.", "answers": ["he does not like coffee", "he doesn't like coffee"], "rule": "Заперечення в Present Simple: do/does not + базова форма.", "explain": "З he вживаємо does not, а дієслово без -s."}, {"type": "transform", "tense": "Past Simple, питання", "from": "They visited their parents", "task": "Зроби питання.", "answers": ["did they visit their parents"], "rule": "Питання в Past Simple: Did + підмет + базова форма.", "explain": "Did бере на себе минулий час, тому visit без -ed."}, {"type": "transform", "tense": "Present Perfect, заперечення", "from": "I have finished the report", "task": "Зроби речення заперечним.", "answers": ["i have not finished the report", "i haven't finished the report"], "rule": "Заперечення в Present Perfect: have/has not + V3.", "explain": "not ставимо після have."}, {"type": "transform", "tense": "Past Simple", "from": "I work late every day", "task": "Перепиши в Past Simple, заміни every day на yesterday.", "answers": ["i worked late yesterday"], "rule": "Past Simple правильних дієслів: дієслово + -ed.", "explain": "yesterday вимагає Past Simple: worked."}, {"type": "transform", "tense": "Present Continuous, питання", "from": "She is reading a book", "task": "Зроби питання.", "answers": ["is she reading a book"], "rule": "Питання в Present Continuous: Am/Is/Are + підмет + -ing.", "explain": "is переходить на початок речення."}, {"type": "transform", "tense": "Future Simple, заперечення", "from": "We will call you tomorrow", "task": "Зро   if(Array.isArray(w.similar)&&w.similar.length>=3)return shuffle(w.similar).slice(0,3).map(x=>({en:x.en,uk:x.uk,fake:true}));
  const pool=allSets().filter(x=>x.kind!=="grammar").flatMap(x=>x.words).filter(x=>norm(x.en)!==norm(w.en));
  const uniq=[...new Map(pool.map(x=>[norm(x.en),x])).values()];

  return own.concat(uniq.sort((a,b)=>lev(a.en,w.en)/Math.max(a.en.length,w.en.length)-lev(b.en,w.en)/Math.max(b.en.length,w.en.length)).slice(0,6).sort(()=>Math.random()-.5)).slice(0,3);

        else{extras[target]=dedupe((extras[target]||[]).concat(ws));saveExtra(target)}}
      useSet(id);save();renderWordList();startStep(0);
      showNote("Додано "+ws.length+". Для власних слів працюють етапи з вибором, перекладом, вимовою і граматикою.");
      return}
    const topic=isAuto?"":isNew?nameInp.value.trim():(allSets().find(x=>x.id===target)||{}).name;
    go.disabled=true;fb.className="fb";fb.textContent="Готую вправи… це може зайняти до хвилини.";
    const prompt=`You make vocabulary exercises for a Ukrainian speaker learning English (level about B1).
${topic?"Topic: "+topic+"\n":""}Word list (one per line, Ukrainian translation may be given after a dash):
${lines.join("\n")}
${isAuto?`
Existing topics (id: name):
${wordSets.map(x=>x.id+": "+x.name).join("\n")}
For each word set "topic" to the id of the existing topic it fits best. If none fits well, set "topic" to a short new topic name in Ukrainian (1-3 words) and use the same new name for related words.
`:""}
Return ONLY a JSON object: {"words":[{"en":"","uk":"",${isAuto?'"topic":"",':""}"gap":"","gapAnswer":"","build":"","buildUk":"","similar":[],"grammar":[]}]} with one entry per word, same order.
- en: the English word or phrase in its base form (fix spelling if needed).
- uk: short Ukrainian translation (keep the given one if provided).
- gap: a natural English sentence (8-14 words) using the word, with the word replaced by "___" exactly once.
- gapAnswer: the exact form that fills the gap (e.g. "improved"), may differ from en.
- build: a different simple English sentence of 5-9 words using the word, no final punctuation, no commas.
- buildUk: Ukrainian translation of build.
- similar: 3 English words or phrases that look or sound very similar to en but mean something different (e.g. valuable: variable, available, invaluable), each as {"en":"","uk":"<short Ukrainian meaning>"}.
- grammar: exactly 2 tasks that use the word, mixing tenses across the list (Present Simple, Present Continuous, Past Simple, Present Perfect, Future Simple) and including negatives and questions:
  {"type":"choose","tense":"<tense name>","q":"sentence with ___ for the verb form, with a clear time marker","options":["4 forms of the same verb, one correct"],"answer":"<the correct option>","rule":"<one-sentence rule in Ukrainian>"}
  {"type":"transform","tense":"<tense name, + заперечення/питання if relevant>","from":"<short English sentence>","task":"<instruction in Ukrainian, e.g. Зроби речення заперечним. / Зроби питання. / Перепиши в Past Simple, заміни every day на yesterday.>","answers":["<full correct sentence without final punctuation, no commas, full forms like did not>"],"rule":"<one-sentence rule in Ukrainian>"}`;
    try{
      const data=await sampleFn.json(prompt,{modelTier:"default"});
      const ws=(data&&data.words||[]).filter(x=>x&&x.en&&x.uk&&x.gap&&x.gap.includes("___")&&x.build&&x.buildUk)
        .map(x=>({...x,grammar:(Array.isArray(x.grammar)?x.grammar:[]).filter(g=>g&&g.rule&&(g.type==="choose"?g.q&&g.q.includes("___")&&Array.isArray(g.options)&&g.options.includes(g.answer):g.type==="transform"&&g.from&&Array.isArray(g.answers)&&g.answers.length))}));
      if(!ws.length||(isNew&&ws.length<2))throw{code:"bad"};
      let id=target;
      const addTo=(tid,list)=>{const c=customs.find(x=>x.id===tid);
        if(c){c.words=dedupe(c.words.concat(list));saveCustom(c)}
        else{extras[tid]=dedupe((extras[tid]||[]).concat(list));saveExtra(tid)}};
      if(isAuto){
        const groups=new Map();
        ws.forEach(w=>{const t=String(w.topic||"").trim()||"Нові слова";delete w.topic;if(!groups.has(t))groups.set(t,[]);groups.get(t).push(w)});
        const summary=[];let first=null;
        groups.forEach((list,t)=>{
          let set=wordSets.find(x=>x.id===t)||allSets().find(x=>x.kind!=="grammar"&&x.name.toLowerCase()===t.toLowerCase());
          if(set){addTo(set.id,list);summary.push(set.name+" +"+list.length)}
          else{const c={id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:t,created:Date.now(),words:list};customs.push(c);saveCustom(c);set=c;summary.push("нова тема «"+t+"» ("+list.length+")")}
          first=first||set.id});
        useSet(first);save();renderWordList();startStep(0);
        showNote("Додано: "+summary.join(", ")+".");
        return;
      }
      if(isNew){const c={id:"c"+Date.now().toString(36),name:topic||"Набір від "+fmtDate(Date.now()),created:Date.now(),words:ws};customs.push(c);saveCustom(c);id=c.id}
      else{const c=customs.find(x=>x.id===target);
        if(c){c.words=dedupe(c.words.concat(ws));saveCustom(c)}
        else{extras[target]=dedupe((extras[target]||[]).concat(ws));saveExtra(target)}}
      useSet(id);save();renderWordList();startStep(0);
    }catch(e){go.disabled=false;fb.className="fb bad";fb.textContent=e&&e.code==="not_granted"?"Без дозволу вправи не створити. Можна надіслати слова в чат.":"Не вийшло підготувати вправи. Спробуй ще раз."}
  };
  const hist=customs.length?el("ul",{class:"hist"},customs.slice().reverse().map(c=>{
    const del=el("button",{class:"linkbtn",type:"button",text:"Видалити"});
    del.onclick=()=>{if(del.dataset.arm){dropCustom(c.id);useSet(cur);renderWordList();rEdit();return}del.dataset.arm="1";del.textContent="Точно видалити?";del.classList.add("danger")};
    return el("li",{},el("div",{class:"hist-t"},el("b",{text:c.name}),el("small",{text:fmtDate(c.created)+" · "+pl(c.words.length,"слово","слова","слів")})),
      el("div",{class:"row"},el("button",{class:"btn ghost",type:"button",text:"Тренувати",onclick:()=>{useSet(c.id);save();renderWordList();startStep(firstOpen())}}),del))})):
    el("p",{class:"hint",text:"Тут з'являтимуться набори, які ти завантажиш."});
  const addedTo=seed.sets.filter(x=>extras[x.id]&&extras[x.id].length);
  card.className="card";
  card.replaceChildren(el("p",{class:"big",style:"font-size:1.5rem",text:"Мої слова"}),
    el("p",{class:"hint",text:ONLINE?"Вистав слова чи фрази, по одному в рядку, або завантаж фото зошита. Переклад можна додати після тире, або Claude підбере його сам і складе речення для всіх етапів, разом із граматикою.":"Вистав слова чи фрази, по одному в рядку, з перекладом після тире, наприклад: improve — покращувати. Твої набори і прогрес зберігаються в цьому браузері."}),
    el("div",{class:"field"},el("label",{for:"target",class:"hint",text:"Куди додати"}),sel),nameBox,
    ONLINE?photoInp:null,ONLINE?photoRow:null,
    el("div",{class:"field"},el("label",{for:"newWords",class:"hint",text:"Слова"}),ta),
    el("div",{class:"row"},go,el("button",{class:"btn ghost",type:"button",text:"Скасувати",onclick:()=>startStep(firstOpen())})),fb,
    el("hr"),el("p",{class:"prompt",text:"Історія наборів"}),hist,
    addedTo.length?el("p",{class:"hint",text:"Твої слова додані до тем: "+addedTo.map(x=>x.name+" (+"+extras[x.id].length+")").join(", ")+"."}):null);
}
document.getElementById("editBtn").onclick=rEdit;

renderWordList();startStep(firstOpen());initStore();
(async()=>{try{sampleFn=window.claude?await window.claude.use("sample"):null}catch(e){sampleFn=null}})();
</script>
